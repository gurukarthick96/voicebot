apiVersion: v1
kind: Service
metadata:
  name: 'bot-server'
  namespace: 'agys-buy'
  labels:
    app: 'bot-server'
    service: 'bot-server'
spec:
  selector:
    app: 'bot-server'
  ports:
    - name: http
      port: 5005
      targetPort: 5005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 'bot-server'
  namespace: 'agys-buy'
  labels:
    app: 'bot-server'
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 'bot-server'
      version: v1
  template:
    metadata:
      labels:
        app: 'bot-server'
        version: v1
    spec:
      nodeSelector:
        nodepool: buydevint
      topologySpreadConstraints:
        - maxSkew: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: 'bot-server'
      containers:
        - name: 'bot-server'
          image: 'agysacrqa.azurecr.io/buy-bot-server:latest'
          imagePullPolicy: Always
          ports:
            - containerPort: 5005
              name: http
          resources:
            limits:
              cpu: '1000m'
              memory: '4096Mi'
          livenessProbe:
            httpGet:
              path: /status
              port: 5005
            initialDelaySeconds: 60
            failureThreshold: 2
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: 5005
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 10
          startupProbe:
            httpGet:
              path: /status
              port: 5005
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 10
          envFrom:
            - configMapRef:
                name: buy-bot-server-configmap
            - secretRef:
                name: buy-bot-server-secret
